[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/inset-host/tests/fixtures/*",
    "examples/*/expected/rust",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.96"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Inset checks integer arithmetic in every build (docs/language/syntax.md, Failures).
[profile.release]
overflow-checks = true
