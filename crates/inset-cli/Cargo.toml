[package]
name = "inset-cli"
version = "0.0.0"
description = "The `inset` command line"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "inset"
path = "src/main.rs"

[dependencies]
inset-check = { path = "../inset-check" }
inset-codegen = { path = "../inset-codegen" }
inset-diagram = { path = "../inset-diagram" }
inset-host = { path = "../inset-host" }
inset-lsp = { path = "../inset-lsp" }
inset-syntax = { path = "../inset-syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1.49"

[lints]
workspace = true
