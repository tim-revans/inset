[package]
name = "inset-diagram"
version = "0.0.0"
description = "The diagram data model emitted by the Inset compiler, its JSON Schema, and an SVG renderer"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
jsonschema = { version = "0.60", default-features = false }

[lints]
workspace = true
