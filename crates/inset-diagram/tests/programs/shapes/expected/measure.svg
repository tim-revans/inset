<marker id="arrow-cap" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="arrow-cap"/></marker>
</defs>
<rect x="0" y="0" width="368.8" height="280" class="ground"/>
<g data-id="Shapes/front/fn:measure">
<text x="16" y="20" class="title">Front::measure</text>
</g>
<text x="16" y="36" class="doc opt-docs">Sorts a number by its size.</text>
<rect x="82.4" y="52" width="204" height="24" rx="12" class="term"/>
<text x="94.4" y="68" class="">measure</text>
<text x="144.8" y="68" class="dim opt-signatures">(n: i32) -&gt; String</text>
<path d="M184.4,76 L184.4,98" class="edge" marker-end="url(#arrow)"/>
<rect x="70" y="98" width="228.8" height="24" rx="2" class="node" data-id="Shapes/front/fn:measure/0"/>
<text x="80" y="114" class="">let size = sizes::classify(n)</text>
<path d="M184.4,122 L184.4,144" class="edge" marker-end="url(#arrow)"/>
<polygon points="85.2,158 99.2,144 269.6,144 283.6,158 269.6,172 99.2,172" class="decide" data-id="Shapes/front/fn:measure/1"/>
<text x="105.2" y="162" class="">let label = match size</text>
<path d="M156,172 L156,182 L73.4,182 L73.4,206" class="edge" data-id="Shapes/front/fn:measure/1/b0"/>
<text x="80.4" y="200" class="dim">Size::Small</text>
<path d="M212.8,172 L212.8,182 L197.6,182 L197.6,206" class="edge" data-id="Shapes/front/fn:measure/1/b1"/>
<text x="204.6" y="200" class="dim">Size::Large(_)</text>
<path d="M73.4,206 L73.4,218 L184.4,218" class="edge"/>
<path d="M197.6,206 L197.6,218 L184.4,218" class="edge"/>
<path d="M184.4,218 L184.4,240" class="edge" marker-end="url(#arrow)"/>
<rect x="16" y="240" width="336.8" height="24" rx="12" class="term" data-id="Shapes/front/fn:measure/2"/>
<text x="26" y="256" class="">format!(&quot;{label} {}&quot;, sizes::total(&amp;[size]))</text>
</svg>
