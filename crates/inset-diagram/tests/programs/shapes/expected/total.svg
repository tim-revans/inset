<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" class="inset-diagram" width="514.4" height="522" viewBox="0 0 514.4 522">
<style>
.inset-diagram text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #e7ecf0; white-space: pre; }
.inset-diagram .title { font-weight: bold; }
.inset-diagram .kw { fill: #5797f8; }
.inset-diagram .dim { fill: #aab2bb; }
.inset-diagram .doc { fill: #aab2bb; font-style: italic; }
.inset-diagram .sec { fill: #aab2bb; font-size: 10px; letter-spacing: 0.05em; }
.inset-diagram .warn { fill: #f64234; font-weight: bold; }
.inset-diagram .ground { fill: #0c1015; }
.inset-diagram .app { fill: #13181d; stroke: #6a7683; stroke-width: 1.5; }
.inset-diagram .comp { fill: #161c23; stroke: #5797f8; stroke-width: 1.4; }
.inset-diagram .ext { fill: #271923; stroke: #e057c5; stroke-width: 1.3; }
.inset-diagram .outside { fill: #161c23; stroke: #727b86; stroke-dasharray: 3 2; }
.inset-diagram .port { fill: #161c23; stroke: #5797f8; stroke-width: 1.6; }
.inset-diagram .edge { fill: none; stroke: #e7ecf0; stroke-width: 1.2; }
.inset-diagram .send { stroke-dasharray: 5 3; }
.inset-diagram .cap { fill: none; stroke: #eba566; stroke-width: 1.8; }
.inset-diagram .node { fill: #161c23; stroke: #e7ecf0; }
.inset-diagram .decide { fill: #36210d; stroke: #e7ecf0; }
.inset-diagram .term { fill: #1a273a; stroke: #e7ecf0; }
.inset-diagram .bar { fill: #e7ecf0; }
.inset-diagram .arrow { fill: #e7ecf0; }
.inset-diagram .arrow-cap { fill: #eba566; }
@media (prefers-color-scheme: light) {
.inset-diagram text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #182029; white-space: pre; }
.inset-diagram .title { font-weight: bold; }
.inset-diagram .kw { fill: #1066f0; }
.inset-diagram .dim { fill: #565f69; }
.inset-diagram .doc { fill: #565f69; font-style: italic; }
.inset-diagram .sec { fill: #565f69; font-size: 10px; letter-spacing: 0.05em; }
.inset-diagram .warn { fill: #9c200b; font-weight: bold; }
.inset-diagram .ground { fill: #fdfdfd; }
.inset-diagram .app { fill: #f2f6fa; stroke: #6a7683; stroke-width: 1.5; }
.inset-diagram .comp { fill: #ffffff; stroke: #196df7; stroke-width: 1.4; }
.inset-diagram .ext { fill: #fef3fe; stroke: #a41faa; stroke-width: 1.3; }
.inset-diagram .outside { fill: #ffffff; stroke: #78818c; stroke-dasharray: 3 2; }
.inset-diagram .port { fill: #ffffff; stroke: #196df7; stroke-width: 1.6; }
.inset-diagram .edge { fill: none; stroke: #182029; stroke-width: 1.2; }
.inset-diagram .send { stroke-dasharray: 5 3; }
.inset-diagram .cap { fill: none; stroke: #e2760f; stroke-width: 1.8; }
.inset-diagram .node { fill: #ffffff; stroke: #182029; }
.inset-diagram .decide { fill: #fff0e7; stroke: #182029; }
.inset-diagram .term { fill: #e9f1fe; stroke: #182029; }
.inset-diagram .bar { fill: #182029; }
.inset-diagram .arrow { fill: #182029; }
.inset-diagram .arrow-cap { fill: #e2760f; }
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="arrow"/></marker>
<marker id="arrow-cap" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="arrow-cap"/></marker>
</defs>
<rect x="0" y="0" width="514.4" height="522" class="ground"/>
<g data-id="Shapes/mod:sizes/fn:total">
<text x="16" y="20" class="title">total</text>
</g>
<text x="16" y="36" class="doc opt-docs">Adds up the large sizes, then takes away thousands until under one.</text>
<rect x="40" y="52" width="225.6" height="24" rx="12" class="term"/>
<text x="52" y="68" class="">total</text>
<text x="88" y="68" class="dim opt-signatures">(sizes: &amp;[Size]) -&gt; u32</text>
<path d="M152.8,76 L152.8,98" class="edge" marker-end="url(#arrow)"/>
<rect x="88.8" y="98" width="128" height="24" rx="2" class="node" data-id="Shapes/mod:sizes/fn:total/0"/>
<text x="98.8" y="114" class="">let mut sum = 0</text>
<path d="M152.8,122 L152.8,144" class="edge" marker-end="url(#arrow)"/>
<polygon points="71.6,158 85.6,144 220,144 234,158 220,172 85.6,172" class="decide" data-id="Shapes/mod:sizes/fn:total/1"/>
<text x="91.6" y="162" class="">for size in sizes</text>
<path d="M152.8,172 L152.8,206" class="edge" marker-end="url(#arrow)" data-id="Shapes/mod:sizes/fn:total/1/body"/>
<text x="156.8" y="198" class="dim">each</text>
<polygon points="32,220 46,206 259.6,206 273.6,220 259.6,234 46,234" class="decide" data-id="Shapes/mod:sizes/fn:total/1/body/0"/>
<text x="52" y="224" class="">if let Size::Large(n) = size</text>
<path d="M117.2,234 L117.2,244 L123.1,244 L123.1,268" class="edge" marker-end="url(#arrow)" data-id="Shapes/mod:sizes/fn:total/1/body/0/b0"/>
<text x="130.1" y="262" class="dim">yes</text>
<rect x="84.3" y="268" width="77.6" height="24" rx="2" class="node" data-id="Shapes/mod:sizes/fn:total/1/body/0/b0/0"/>
<text x="94.3" y="284" class="">sum += n</text>
<path d="M188.4,234 L188.4,244 L199.9,244 L199.9,268" class="edge" data-id="Shapes/mod:sizes/fn:total/1/body/0/b1"/>
<text x="206.9" y="262" class="dim">no</text>
<path d="M123.1,292 L123.1,304 L152.8,304" class="edge"/>
<path d="M199.9,268 L199.9,304 L152.8,304" class="edge"/>
<path d="M152.8,304 L152.8,314 L24,314 L24,158 L71.6,158" class="edge" marker-end="url(#arrow)"/>
<path d="M234,158 L283.6,158 L283.6,328 L152.8,328" class="edge" data-id="Shapes/mod:sizes/fn:total/1/skip"/>
<text x="289.6" y="174" class="dim">none</text>
<path d="M152.8,328 L152.8,350" class="edge" marker-end="url(#arrow)"/>
<polygon points="71.6,364 85.6,350 220,350 234,364 220,378 85.6,378" class="decide" data-id="Shapes/mod:sizes/fn:total/2"/>
<text x="91.6" y="368" class="">while sum &gt;= 1000</text>
<path d="M152.8,378 L152.8,412" class="edge" marker-end="url(#arrow)" data-id="Shapes/mod:sizes/fn:total/2/body"/>
<text x="156.8" y="404" class="dim">repeat</text>
<rect x="103.2" y="412" width="99.2" height="24" rx="2" class="node" data-id="Shapes/mod:sizes/fn:total/2/body/0"/>
<text x="113.2" y="428" class="">sum -= 1000</text>
<path d="M152.8,436 L152.8,446 L63.6,446 L63.6,364 L71.6,364" class="edge" marker-end="url(#arrow)"/>
<path d="M234,364 L244,364 L244,460 L152.8,460" class="edge" data-id="Shapes/mod:sizes/fn:total/2/skip"/>
<text x="250" y="380" class="dim">none</text>
<path d="M152.8,460 L152.8,482" class="edge" marker-end="url(#arrow)"/>
<rect x="132" y="482" width="41.6" height="24" rx="12" class="term" data-id="Shapes/mod:sizes/fn:total/3"/>
<text x="142" y="498" class="">sum</text>
</svg>
