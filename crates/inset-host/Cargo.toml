[package]
name = "inset-host"
version = "0.0.0"
description = "The WebAssembly host that runs Inset programs with only the capabilities they are granted"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
rand = { version = "0.10.1", default-features = false, features = ["std_rng"] }
tokio = { version = "1.54.1", features = ["rt", "net", "macros", "sync"] }
wasmtime = { version = "49.0.5", default-features = false, features = ["cranelift", "component-model", "cache", "parallel-compilation", "std", "runtime", "addr2line", "demangle"] }
wasmtime-wasi = { version = "49.0.5", default-features = false, features = ["p2"] }

[lints]
workspace = true
