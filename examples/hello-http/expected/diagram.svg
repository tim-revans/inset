<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" class="inset-diagram" width="730.4" height="226" viewBox="0 0 730.4 226">
<style>
.inset-diagram text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #e7ecf0; white-space: pre; }
.inset-diagram .title { font-weight: bold; }
.inset-diagram .kw { fill: #5797f8; }
.inset-diagram .dim { fill: #aab2bb; }
.inset-diagram .doc { fill: #aab2bb; font-style: italic; }
.inset-diagram .sec { fill: #aab2bb; font-size: 10px; letter-spacing: 0.05em; }
.inset-diagram .warn { fill: #f64234; font-weight: bold; }
.inset-diagram .ground { fill: #0c1015; }
.inset-diagram .app { fill: #13181d; stroke: #6a7683; stroke-width: 1.5; }
.inset-diagram .comp { fill: #161c23; stroke: #5797f8; stroke-width: 1.4; }
.inset-diagram .ext { fill: #271923; stroke: #e057c5; stroke-width: 1.3; }
.inset-diagram .outside { fill: #161c23; stroke: #727b86; stroke-dasharray: 3 2; }
.inset-diagram .port { fill: #161c23; stroke: #5797f8; stroke-width: 1.6; }
.inset-diagram .edge { fill: none; stroke: #e7ecf0; stroke-width: 1.2; }
.inset-diagram .send { stroke-dasharray: 5 3; }
.inset-diagram .cap { fill: none; stroke: #eba566; stroke-width: 1.8; }
.inset-diagram .node { fill: #161c23; stroke: #e7ecf0; }
.inset-diagram .decide { fill: #36210d; stroke: #e7ecf0; }
.inset-diagram .term { fill: #1a273a; stroke: #e7ecf0; }
.inset-diagram .bar { fill: #e7ecf0; }
.inset-diagram .arrow { fill: #e7ecf0; }
.inset-diagram .arrow-cap { fill: #eba566; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="arrow"/></marker>
<marker id="arrow-cap" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="arrow-cap"/></marker>
</defs>
<rect x="0" y="0" width="730.4" height="226" class="ground"/>
<rect x="263.6" y="16" width="450.8" height="194" rx="8" class="app" data-id="HelloHttp"/>
<g data-id="HelloHttp">
<text x="273.6" y="34" class="kw">app </text>
<text x="302.4" y="34" class="title">HelloHttp</text>
</g>
<text x="273.6" y="50" class="doc opt-docs">Hello HTTP: the smallest Inset program that serves the web.</text>
<g data-id="HelloHttp/setting:port">
<title class="opt-docs">The port to serve on.</title>
<text x="273.6" y="66" class="kw">setting </text>
<text x="331.2" y="66" class="">port</text>
<text x="360" y="66" class="dim opt-setting-types">: u16</text>
<text x="396" y="66" class=""> = 8080</text>
</g>
<g data-id="HelloHttp/grant:http">
<text x="273.6" y="82" class="kw">grant </text>
<text x="316.8" y="82" class="">http</text>
<text x="345.6" y="82" class="dim opt-grant-types">: HttpServer</text>
<text x="432" y="82" class=" opt-grant-values"> { port: setting port }</text>
</g>
<rect x="293.6" y="95" width="371.6" height="96" rx="4" class="comp" data-id="HelloHttp/Greeter"/>
<g data-id="HelloHttp/Greeter">
<text x="303.6" y="113" class="title">Greeter</text>
</g>
<text x="303.6" y="129" class="doc opt-docs">Greets visitors by name.</text>
<text x="303.6" y="145" class="dim opt-handoffs">start { http: move http }</text>
<text x="303.6" y="161" class="sec">routes</text>
<g data-id="HelloHttp/Greeter/fn:hello">
<title class="opt-docs">Replies with a greeting for the name in the path.</title>
<text x="303.6" y="177" class="kw">GET </text>
<text x="332.4" y="177" class="">/hello/{name}  </text>
<text x="440.4" y="177" class="">hello</text>
<text x="476.4" y="177" class="dim opt-signatures">(name: String) -&gt; String</text>
</g>
<path d="M116.4,173 L293.6,173" class="cap" marker-end="url(#arrow-cap)" data-id="HelloHttp/Greeter/field:http-&gt;HelloHttp/grant:http"/>
<text x="126.4" y="168" class=" opt-capability-names">http</text>
<text x="155.2" y="168" class="dim opt-capability-types">: HttpServer</text>
<rect x="10" y="162" width="106.4" height="22" rx="11" class="outside" data-id="HelloHttp/grant:http/outside"/>
<text x="20" y="177" class="">HTTP clients</text>
</svg>
