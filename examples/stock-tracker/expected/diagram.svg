<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" class="inset-diagram" width="1448.8" height="466" viewBox="0 0 1448.8 466">
<style>
.inset-diagram text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #e7ecf0; white-space: pre; }
.inset-diagram .title { font-weight: bold; }
.inset-diagram .kw { fill: #5797f8; }
.inset-diagram .dim { fill: #aab2bb; }
.inset-diagram .doc { fill: #aab2bb; font-style: italic; }
.inset-diagram .sec { fill: #aab2bb; font-size: 10px; letter-spacing: 0.05em; }
.inset-diagram .warn { fill: #f64234; font-weight: bold; }
.inset-diagram .ground { fill: #0c1015; }
.inset-diagram .app { fill: #13181d; stroke: #6a7683; stroke-width: 1.5; }
.inset-diagram .comp { fill: #161c23; stroke: #5797f8; stroke-width: 1.4; }
.inset-diagram .ext { fill: #271923; stroke: #e057c5; stroke-width: 1.3; }
.inset-diagram .outside { fill: #161c23; stroke: #727b86; stroke-dasharray: 3 2; }
.inset-diagram .port { fill: #161c23; stroke: #5797f8; stroke-width: 1.6; }
.inset-diagram .edge { fill: none; stroke: #e7ecf0; stroke-width: 1.2; }
.inset-diagram .send { stroke-dasharray: 5 3; }
.inset-diagram .cap { fill: none; stroke: #eba566; stroke-width: 1.8; }
.inset-diagram .node { fill: #161c23; stroke: #e7ecf0; }
.inset-diagram .decide { fill: #36210d; stroke: #e7ecf0; }
.inset-diagram .term { fill: #1a273a; stroke: #e7ecf0; }
.inset-diagram .bar { fill: #e7ecf0; }
.inset-diagram .arrow { fill: #e7ecf0; }
.inset-diagram .arrow-cap { fill: #eba566; }
@media (prefers-color-scheme: light) {
.inset-diagram text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #182029; white-space: pre; }
.inset-diagram .title { font-weight: bold; }
.inset-diagram .kw { fill: #1066f0; }
.inset-diagram .dim { fill: #565f69; }
.inset-diagram .doc { fill: #565f69; font-style: italic; }
.inset-diagram .sec { fill: #565f69; font-size: 10px; letter-spacing: 0.05em; }
.inset-diagram .warn { fill: #9c200b; font-weight: bold; }
.inset-diagram .ground { fill: #fdfdfd; }
.inset-diagram .app { fill: #f2f6fa; stroke: #6a7683; stroke-width: 1.5; }
.inset-diagram .comp { fill: #ffffff; stroke: #196df7; stroke-width: 1.4; }
.inset-diagram .ext { fill: #fef3fe; stroke: #a41faa; stroke-width: 1.3; }
.inset-diagram .outside { fill: #ffffff; stroke: #78818c; stroke-dasharray: 3 2; }
.inset-diagram .port { fill: #ffffff; stroke: #196df7; stroke-width: 1.6; }
.inset-diagram .edge { fill: none; stroke: #182029; stroke-width: 1.2; }
.inset-diagram .send { stroke-dasharray: 5 3; }
.inset-diagram .cap { fill: none; stroke: #e2760f; stroke-width: 1.8; }
.inset-diagram .node { fill: #ffffff; stroke: #182029; }
.inset-diagram .decide { fill: #fff0e7; stroke: #182029; }
.inset-diagram .term { fill: #e9f1fe; stroke: #182029; }
.inset-diagram .bar { fill: #182029; }
.inset-diagram .arrow { fill: #182029; }
.inset-diagram .arrow-cap { fill: #e2760f; }
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="arrow"/></marker>
<marker id="arrow-cap" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="arrow-cap"/></marker>
</defs>
<rect x="0" y="0" width="1448.8" height="466" class="ground"/>
<rect x="263.6" y="16" width="878.4" height="434" rx="8" class="app" data-id="StockTracker"/>
<g data-id="StockTracker">
<text x="273.6" y="34" class="kw">app </text>
<text x="302.4" y="34" class="title">StockTracker</text>
</g>
<text x="273.6" y="50" class="doc opt-docs">Stock tracker: how many of each item the warehouse holds, and</text>
<text x="273.6" y="66" class="doc opt-docs">what to reorder.</text>
<g data-id="StockTracker/setting:port">
<title class="opt-docs">The port to serve on.</title>
<text x="273.6" y="82" class="kw">setting </text>
<text x="331.2" y="82" class="">port</text>
<text x="360" y="82" class="dim opt-setting-types">: u16</text>
<text x="396" y="82" class=""> = 8080</text>
</g>
<g data-id="StockTracker/grant:http">
<text x="273.6" y="98" class="kw">grant </text>
<text x="316.8" y="98" class="">http</text>
<text x="345.6" y="98" class="dim opt-grant-types">: HttpServer</text>
<text x="432" y="98" class=" opt-grant-values"> { port: setting port }</text>
</g>
<g data-id="StockTracker/grant:items">
<text x="273.6" y="114" class="kw">grant </text>
<text x="316.8" y="114" class="">items</text>
<text x="352.8" y="114" class="dim opt-grant-types">: Table&lt;String, Item&gt;</text>
<text x="504" y="114" class=" opt-grant-values"> { file: &quot;stock.db&quot;, name: &quot;items&quot; }</text>
</g>
<rect x="293.6" y="127" width="832.4" height="304" rx="4" class="comp" data-id="StockTracker/Warehouse"/>
<g data-id="StockTracker/Warehouse">
<text x="303.6" y="145" class="title">Warehouse</text>
</g>
<text x="303.6" y="161" class="doc opt-docs">Answers HTTP requests from warehouse staff about stock and</text>
<text x="303.6" y="177" class="doc opt-docs">reorders.</text>
<text x="303.6" y="193" class="dim opt-handoffs">start { http: move http, items: move items }</text>
<text x="303.6" y="209" class="sec">fields</text>
<g data-id="StockTracker/Warehouse/field:items">
<text x="303.6" y="225" class="">items</text>
<text x="339.6" y="225" class="dim opt-field-types">: Table&lt;String, Item&gt;</text>
<text x="490.8" y="225" class="dim">, handed down</text>
</g>
<text x="303.6" y="241" class="sec">routes</text>
<g data-id="StockTracker/Warehouse/fn:stock">
<title class="opt-docs">Replies with the quantity on hand.</title>
<text x="303.6" y="257" class="kw">GET </text>
<text x="332.4" y="257" class="">/items/{sku}  </text>
<text x="433.2" y="257" class="">stock</text>
<text x="469.2" y="257" class="dim opt-signatures">(&amp;self, sku: String) -&gt; Option&lt;String&gt;</text>
</g>
<g data-id="StockTracker/Warehouse/fn:stock_levels">
<title class="opt-docs">Lists every item's stock in SKU order, or with `low=true`, only the&#10;items at or below their reorder level.</title>
<text x="303.6" y="273" class="kw">GET </text>
<text x="332.4" y="273" class="">/items?{low}  </text>
<text x="433.2" y="273" class="">stock_levels</text>
<text x="519.6" y="273" class="dim opt-signatures">(&amp;self, low: Option&lt;bool&gt;) -&gt; Json&lt;Vec&lt;StockLevel&gt;&gt;</text>
</g>
<g data-id="StockTracker/Warehouse/fn:stock_item">
<title class="opt-docs">Stocks an item with the levels given, replacing any it had, and&#10;replies with the quantity on hand.</title>
<text x="303.6" y="289" class="kw">PUT </text>
<text x="332.4" y="289" class="">/items/{sku}  </text>
<text x="433.2" y="289" class="dim">body item  </text>
<text x="512.4" y="289" class="">stock_item</text>
<text x="584.4" y="289" class="dim opt-signatures">(&amp;self, sku: String, item: Json&lt;Item&gt;) -&gt; String</text>
</g>
<g data-id="StockTracker/Warehouse/fn:receive">
<title class="opt-docs">Adds stock that has arrived, and replies with the new quantity on hand.</title>
<text x="303.6" y="305" class="kw">POST </text>
<text x="339.6" y="305" class="">/items/{sku}/receipts  </text>
<text x="505.2" y="305" class="dim">body quantity  </text>
<text x="613.2" y="305" class="">receive</text>
<text x="663.6" y="305" class="dim opt-signatures">(&amp;self, sku: String, quantity: u32) -&gt; Option&lt;String&gt;</text>
</g>
<g data-id="StockTracker/Warehouse/fn:ship">
<title class="opt-docs">Takes away stock that has been shipped, and replies with the new quantity on hand.</title>
<text x="303.6" y="321" class="kw">POST </text>
<text x="339.6" y="321" class="">/items/{sku}/shipments  </text>
<text x="512.4" y="321" class="dim">body quantity  </text>
<text x="620.4" y="321" class="">ship</text>
<text x="649.2" y="321" class="dim opt-signatures">(&amp;self, sku: String, quantity: u32) -&gt; Result&lt;String, ShipError&gt;</text>
</g>
<g data-id="StockTracker/Warehouse/fn:pending_reorders">
<title class="opt-docs">Lists the reorders waiting to be placed, one per line: the SKU, then the quantity.</title>
<text x="303.6" y="337" class="kw">GET </text>
<text x="332.4" y="337" class="">/reorders  </text>
<text x="411.6" y="337" class="">pending_reorders</text>
<text x="526.8" y="337" class="dim opt-signatures">(&amp;self) -&gt; String</text>
</g>
<text x="303.6" y="353" class="sec opt-failures">failure</text>
<g data-id="StockTracker/Warehouse/failure:message:inventory">
<text x="303.6" y="369" class="warn opt-failures">Message(inventory) =&gt; rollback</text>
</g>
<text x="303.6" y="385" class="doc opt-failures opt-failure-reasons">  Inventory rolls back a request whose database call fails, so</text>
<text x="303.6" y="401" class="doc opt-failures opt-failure-reasons">  this request fails too.</text>
<text x="303.6" y="417" class="dim">[+] reorders: Reorders, inventory: Inventory</text>
<path d="M116.4,253 L293.6,253" class="cap" marker-end="url(#arrow-cap)" data-id="StockTracker/Warehouse/field:http-&gt;StockTracker/grant:http"/>
<text x="126.4" y="248" class=" opt-capability-names">http</text>
<text x="155.2" y="248" class="dim opt-capability-types">: HttpServer</text>
<rect x="10" y="242" width="106.4" height="22" rx="11" class="outside" data-id="StockTracker/grant:http/outside"/>
<text x="20" y="257" class="">HTTP clients</text>
<rect x="10" y="280" width="120.8" height="22" rx="4" class="outside" data-id="StockTracker/front_end"/>
<text x="20" y="295" class="title">front end</text>
<text x="84.8" y="295" class="dim"> web/</text>
<path d="M130.8,291 L138.8,291 L138.8,269 L293.6,269" class="edge" marker-end="url(#arrow)" data-id="StockTracker/front_end-&gt;StockTracker/Warehouse/fn:stock_levels"/>
<path d="M130.8,291 L148.8,291 L148.8,285 L293.6,285" class="edge" marker-end="url(#arrow)" data-id="StockTracker/front_end-&gt;StockTracker/Warehouse/fn:stock_item"/>
<path d="M1126,141 L1361.2,141" class="cap" marker-end="url(#arrow-cap)" data-id="StockTracker/Warehouse/inventory/field:items-&gt;StockTracker/grant:items"/>
<text x="1152" y="136" class=" opt-capability-names">items</text>
<text x="1188" y="136" class="dim opt-capability-types">: Table&lt;String, Item&gt;</text>
<text x="1152" y="155" class="dim opt-capability-operations">entries, get, insert</text>
<rect x="1361.2" y="130" width="77.6" height="22" rx="11" class="outside" data-id="StockTracker/grant:items/outside"/>
<text x="1371.2" y="145" class="">stock.db</text>
</svg>
