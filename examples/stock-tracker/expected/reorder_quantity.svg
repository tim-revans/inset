<text x="16" y="20" class="title">Inventory::reorder_quantity</text>
</g>
<text x="16" y="36" class="doc opt-docs">How many to reorder so that stock goes back up to its target level.</text>
<rect x="16" y="52" width="571.2" height="24" rx="12" class="term"/>
<text x="28" y="68" class="">reorder_quantity</text>
<text x="143.2" y="68" class="dim opt-signatures">(on_hand: u32, reorder_level: u32, target_level: u32) -&gt; u32</text>
<path d="M301.6,76 L301.6,98" class="edge" marker-end="url(#arrow)"/>
<polygon points="188,112 202,98 401.2,98 415.2,112 401.2,126 202,126" class="decide" data-id="StockTracker/Warehouse/inventory/fn:reorder_quantity/0"/>
<text x="208" y="116" class="">if on_hand &gt; reorder_level</text>
<path d="M268.4,126 L268.4,136 L140.5,136 L140.5,160" class="edge" marker-end="url(#arrow)" data-id="StockTracker/Warehouse/inventory/fn:reorder_quantity/0/b0"/>
<text x="147.5" y="154" class="dim">yes</text>
