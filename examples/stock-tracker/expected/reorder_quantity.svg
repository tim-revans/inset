<text x="136.9" y="176" class="">0</text>
<path d="M334.8,126 L334.8,136 L336.7,136 L336.7,160" class="edge" marker-end="url(#arrow)" data-id="StockTracker/Warehouse/inventory/fn:reorder_quantity/0/b1"/>
<text x="343.7" y="154" class="dim">no</text>
<rect x="197.1" y="160" width="279.2" height="24" rx="12" class="term" data-id="StockTracker/Warehouse/inventory/fn:reorder_quantity/0/b1/0"/>
<text x="207.1" y="176" class="">target_level.saturating_sub(on_hand)</text>
