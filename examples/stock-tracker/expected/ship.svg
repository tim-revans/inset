<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" class="inset-diagram" width="545.6" height="732" viewBox="0 0 545.6 732">
<style>
.inset-diagram text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #e7ecf0; white-space: pre; }
.inset-diagram .title { font-weight: bold; }
.inset-diagram .kw { fill: #5797f8; }
.inset-diagram .dim { fill: #aab2bb; }
.inset-diagram .doc { fill: #aab2bb; font-style: italic; }
.inset-diagram .sec { fill: #aab2bb; font-size: 10px; letter-spacing: 0.05em; }
.inset-diagram .warn { fill: #f64234; font-weight: bold; }
.inset-diagram .ground { fill: #0c1015; }
.inset-diagram .app { fill: #13181d; stroke: #6a7683; stroke-width: 1.5; }
.inset-diagram .comp { fill: #161c23; stroke: #5797f8; stroke-width: 1.4; }
.inset-diagram .ext { fill: #271923; stroke: #e057c5; stroke-width: 1.3; }
.inset-diagram .outside { fill: #161c23; stroke: #727b86; stroke-dasharray: 3 2; }
.inset-diagram .port { fill: #161c23; stroke: #5797f8; stroke-width: 1.6; }
.inset-diagram .edge { fill: none; stroke: #e7ecf0; stroke-width: 1.2; }
.inset-diagram .send { stroke-dasharray: 5 3; }
.inset-diagram .cap { fill: none; stroke: #eba566; stroke-width: 1.8; }
.inset-diagram .node { fill: #161c23; stroke: #e7ecf0; }
.inset-diagram .decide { fill: #36210d; stroke: #e7ecf0; }
.inset-diagram .term { fill: #1a273a; stroke: #e7ecf0; }
.inset-diagram .bar { fill: #e7ecf0; }
.inset-diagram .arrow { fill: #e7ecf0; }
.inset-diagram .arrow-cap { fill: #eba566; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="arrow"/></marker>
<marker id="arrow-cap" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="arrow-cap"/></marker>
</defs>
<rect x="0" y="0" width="545.6" height="732" class="ground"/>
<g data-id="StockTracker/Warehouse/inventory/fn:ship">
<text x="16" y="20" class="title">Inventory::ship</text>
</g>
<text x="16" y="36" class="doc opt-docs">Takes from an item's stock if it holds enough, and returns the item as</text>
<text x="16" y="52" class="doc opt-docs">it now stands. Raises a reorder if that leaves stock at or below its</text>
<text x="16" y="68" class="doc opt-docs">reorder level.</text>
<rect x="16" y="84" width="513.6" height="24" rx="12" class="term"/>
<text x="28" y="100" class="">ship</text>
<text x="56.8" y="100" class="dim opt-signatures">(&amp;mut self, sku: &amp;str, quantity: u32) -&gt; Result&lt;Item, ShipError&gt;</text>
<path d="M272.8,108 L272.8,130" class="edge" marker-end="url(#arrow)"/>
<polygon points="87.2,152 101.2,130 444.4,130 458.4,152 444.4,174 101.2,174" class="decide" data-id="StockTracker/Warehouse/inventory/fn:ship/0"/>
<text x="107.2" y="148" class="">let Some(mut item) = self.items.get(sku).await</text>
<text x="107.2" y="164" class="">else</text>
<path d="M215.6,174 L215.6,184 L102.7,184 L102.7,208" class="edge" data-id="StockTracker/Warehouse/inventory/fn:ship/0/b0"/>
<text x="109.7" y="202" class="dim">Some(mut item)</text>
<path d="M330,174 L330,184 L345.7,184 L345.7,208" class="edge" marker-end="url(#arrow)" data-id="StockTracker/Warehouse/inventory/fn:ship/0/b1"/>
<text x="352.7" y="202" class="dim">else</text>
<rect x="238.5" y="208" width="214.4" height="24" rx="12" class="term" data-id="StockTracker/Warehouse/inventory/fn:ship/0/b1/0"/>
<text x="248.5" y="224" class="">Err(ShipError::UnknownItem)</text>
<path d="M102.7,208 L102.7,244 L272.8,244" class="edge"/>
<path d="M272.8,244 L272.8,266" class="edge" marker-end="url(#arrow)"/>
<polygon points="159.2,280 173.2,266 372.4,266 386.4,280 372.4,294 173.2,294" class="decide" data-id="StockTracker/Warehouse/inventory/fn:ship/1"/>
<text x="179.2" y="284" class="">if item.on_hand &lt; quantity</text>
<path d="M239.6,294 L239.6,304 L243.1,304 L243.1,328" class="edge" marker-end="url(#arrow)" data-id="StockTracker/Warehouse/inventory/fn:ship/1/b0"/>
<text x="250.1" y="322" class="dim">yes</text>
<rect x="125.1" y="328" width="236" height="24" rx="12" class="term" data-id="StockTracker/Warehouse/inventory/fn:ship/1/b0/0"/>
<text x="135.1" y="344" class="">Err(ShipError::NotEnoughStock)</text>
<path d="M306,294 L306,304 L399.1,304 L399.1,328" class="edge" data-id="StockTracker/Warehouse/inventory/fn:ship/1/b1"/>
<text x="406.1" y="322" class="dim">no</text>
<path d="M399.1,328 L399.1,364 L272.8,364" class="edge"/>
<path d="M272.8,364 L272.8,386" class="edge" marker-end="url(#arrow)"/>
<rect x="176.4" y="386" width="192.8" height="24" rx="2" class="node" data-id="StockTracker/Warehouse/inventory/fn:ship/2"/>
<text x="186.4" y="402" class="">item.on_hand -= quantity</text>
<path d="M272.8,410 L272.8,432" class="edge" marker-end="url(#arrow)"/>
<rect x="140.4" y="432" width="264.8" height="40" rx="2" class="node" data-id="StockTracker/Warehouse/inventory/fn:ship/3"/>
<text x="150.4" y="448" class="">self.items.insert(sku.to_string(),</text>
<text x="150.4" y="464" class="">item.clone()).await</text>
<path d="M272.8,472 L272.8,494" class="edge" marker-end="url(#arrow)"/>
<rect x="90" y="494" width="365.6" height="40" rx="2" class="node" data-id="StockTracker/Warehouse/inventory/fn:ship/4"/>
<text x="100" y="510" class="">let order = Self::reorder_quantity(item.on_hand,</text>
<text x="100" y="526" class="">item.reorder_level, item.target_level)</text>
<path d="M272.8,534 L272.8,556" class="edge" marker-end="url(#arrow)"/>
<polygon points="209.6,570 223.6,556 322,556 336,570 322,584 223.6,584" class="decide" data-id="StockTracker/Warehouse/inventory/fn:ship/5"/>
<text x="229.6" y="574" class="">if order &gt; 0</text>
<path d="M256.4,584 L256.4,594 L243.1,594 L243.1,618" class="edge" marker-end="url(#arrow)" data-id="StockTracker/Warehouse/inventory/fn:ship/5/b0"/>
<text x="250.1" y="612" class="dim">yes</text>
<rect x="92.7" y="618" width="300.8" height="40" rx="2" class="node" data-id="StockTracker/Warehouse/inventory/fn:ship/5/b0/0"/>
<text x="102.7" y="634" class="">send self.low_stock.emit(Reorder { sku:</text>
<text x="102.7" y="650" class="">sku.to_string(), quantity: order })</text>
<path d="M289.2,584 L289.2,594 L431.5,594 L431.5,618" class="edge" data-id="StockTracker/Warehouse/inventory/fn:ship/5/b1"/>
<text x="438.5" y="612" class="dim">no</text>
<path d="M243.1,658 L243.1,670 L272.8,670" class="edge"/>
<path d="M431.5,618 L431.5,670 L272.8,670" class="edge"/>
<path d="M272.8,670 L272.8,692" class="edge" marker-end="url(#arrow)"/>
<rect x="234" y="692" width="77.6" height="24" rx="12" class="term" data-id="StockTracker/Warehouse/inventory/fn:ship/6"/>
<text x="244" y="708" class="">Ok(item)</text>
</svg>
